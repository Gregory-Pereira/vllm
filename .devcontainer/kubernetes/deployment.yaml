apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-devcontainer
  labels:
    app: vllm-devcontainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-devcontainer
  template:
    metadata:
      labels:
        app: vllm-devcontainer
    spec:
      # No automatic K8s API access — mount a kubeconfig explicitly if needed
      automountServiceAccountToken: false

      containers:
        - name: dev
          # Override this with your registry/image:tag
          image: vllm-devcontainer:latest
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"

          volumeMounts:
            # Persistent workspace — survives pod restarts
            - name: workspace
              mountPath: /workspace

            # Git credentials (created via deploy.sh setup-secrets)
            - name: git-ssh
              mountPath: /home/vllm-dev/.ssh
              readOnly: true
            - name: git-config
              mountPath: /home/vllm-dev/.gitconfig
              subPath: gitconfig
              readOnly: true

            # ccache for faster C++/CUDA rebuilds across restarts
            - name: ccache
              mountPath: /workspace/.ccache

            ## Uncomment to mount kubeconfig for in-pod kubectl access:
            # - name: kube-config
            #   mountPath: /home/vllm-dev/.kube/config
            #   subPath: config
            #   readOnly: true

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: vllm-devcontainer-workspace

        - name: git-ssh
          secret:
            secretName: vllm-dev-git-ssh
            defaultMode: 0600

        - name: git-config
          secret:
            secretName: vllm-dev-git-config
            defaultMode: 0644

        - name: ccache
          persistentVolumeClaim:
            claimName: vllm-devcontainer-ccache

        ## Uncomment to mount kubeconfig:
        # - name: kube-config
        #   secret:
        #     secretName: vllm-dev-kubeconfig
        #     defaultMode: 0600

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-devcontainer-workspace
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-devcontainer-ccache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
